name: JVM Test Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jdk:
    name: JDK • ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum hosted macOS and practical JDK floor for this stack.
          - name: macos14-arm64-temurin-jdk17
            os: macos-14
            distribution: temurin
            java: "17"

          # Mainstream arm64 lane on the common current LTS JDK.
          - name: macos15-arm64-temurin-jdk21
            os: macos-15
            distribution: temurin
            java: "21"

          # Vendor coverage on the mainstream lane.
          - name: macos15-arm64-corretto-jdk21
            os: macos-15
            distribution: corretto
            java: "21"

          - name: macos15-arm64-zulu-jdk21
            os: macos-15
            distribution: zulu
            java: "21"

          - name: macos15-arm64-jetbrains-jdk21
            os: macos-15
            distribution: jetbrains
            java: "21"

          # Hosted Intel smoke lane.
          - name: macos15-intel-temurin-jdk21
            os: macos-15-intel
            distribution: temurin
            java: "21"

          # Newest hosted macOS and JDK lane.
          - name: macos26-arm64-temurin-jdk23
            os: macos-26
            distribution: temurin
            java: "23"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ${{ matrix.distribution }} JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Print Java version
        run: java -version

      - name: Run JVM tests
        run: ./gradlew :composeApp:jvmTest --stacktrace

      - name: Summarize JVM test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("composeApp/build/test-results/jvmTest/TEST-*.xml"))
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          total = 0
          failures = 0
          errors = 0
          skipped = 0
          duration = 0.0
          all_cases = []
          failed_cases = []

          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.attrib.get("tests", 0))
              failures += int(root.attrib.get("failures", 0))
              errors += int(root.attrib.get("errors", 0))
              skipped += int(root.attrib.get("skipped", 0))
              duration += float(root.attrib.get("time", 0.0))

              suite = root.attrib.get("name", os.path.basename(path))
              for case in root.findall("testcase"):
                  all_cases.append(
                      (
                          suite,
                          case.attrib.get("name", "<unknown>"),
                      )
                  )
                  failure = case.find("failure")
                  error = case.find("error")
                  if failure is not None or error is not None:
                      issue = failure if failure is not None else error
                      failed_cases.append(
                          (
                              suite,
                              case.attrib.get("name", "<unknown>"),
                              issue.attrib.get("message", "").strip(),
                          )
                      )

          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write("## JVM test report\n\n")
              fh.write("| Total | Failures | Errors | Skipped | Time (s) |\n")
              fh.write("| ---: | ---: | ---: | ---: | ---: |\n")
              fh.write(f"| {total} | {failures} | {errors} | {skipped} | {duration:.3f} |\n\n")

              if failed_cases:
                  fh.write("### Failed tests\n\n")
                  for suite, case, message in failed_cases[:20]:
                      short = message.splitlines()[0] if message else ""
                      fh.write(f"- `{suite}` / `{case}`: {short}\n")
                  if len(failed_cases) > 20:
                      fh.write(f"- ... and {len(failed_cases) - 20} more\n")
                  fh.write("\n")
              else:
                  fh.write("All JVM tests passed.\n\n")

              if all_cases:
                  fh.write("### Executed tests\n\n")
                  for suite, case in all_cases:
                      fh.write(f"- `{suite}` / `{case}`\n")
                  fh.write("\n")

              fh.write("Artifacts include:\n")
              fh.write("- JUnit XML: `composeApp/build/test-results/jvmTest`\n")
              fh.write("- HTML report: `composeApp/build/reports/tests/jvmTest`\n")
          PY

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdk-test-report-${{ matrix.name }}
          path: |
            composeApp/build/test-results/jvmTest
            composeApp/build/reports/tests/jvmTest
          if-no-files-found: warn
          retention-days: 14
